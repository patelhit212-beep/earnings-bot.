name: Earnings Alert 2PM

on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test / force / normal'
        type: choice
        options: [test, force, normal]
        default: test
      date:
        description: 'force ke liye date (YYYY-MM-DD), khaali = aaj'
        required: false
        default: ''

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run earnings bot
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
          EARN_DATE: ${{ github.event.inputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node earnings.mjs
